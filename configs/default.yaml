# HypoSense Twin v2 — default configuration
# Source: Blueprint v2.0 Appendix F (+ Table 5.1, Section 11.1, Table 18.1, Section 20.1).
#
# STATUS: DRAFT — NOT FROZEN.
# This file is hashed into the freeze manifest at protocol freeze (docs/IMPLEMENTATION_PLAN.md, "Freeze").
#
# CHANGE CONTROL
#   Keys marked [CLASS C] are scientific-protocol constants. They are pinned by
#   tests/regression/test_protocol_constants.py. Changing one requires an approved
#   proposal in docs/PROPOSALS.md and a DECISION_LOG entry — never a silent edit.
#   Keys marked [CLASS B] may change only through a documented development-data experiment.
#   Unmarked keys are engineering settings (Class A).

protocol_version: "2.0-draft"

event:                              # [CLASS C] Table 5.1
  threshold_mgdl: 70                # L1 episode threshold
  l2_threshold_mgdl: 54             # L2 (secondary)
  min_run: 2                        # >=2 consecutive readings below threshold
  max_step_min: 20                  # max spacing between the two onset readings AND between the two
                                    # recovery readings ("consecutive"; ANALYSIS_PLAN §0, executable spec)
  max_gap_min: 30                   # a gap > 30 min ends an episode
  horizon_min: 60                   # positive window (t, t + 60 min]
  min_lead_min: 15                  # correct warning in [onset - 60, onset - 15]
  refractory_min: 60                # no prediction time within 60 min after an episode ends

eligibility:                        # [CLASS C] Table 5.1 "Prediction time t"
  history_min: 120                  # window (t - 120 min, t]
  min_readings_in_history: 7        # >= 7 of the last 8 readings
  follow_up_min: 60                 # evaluation-only (label side): >= 60 min follow-up or onset within it
  min_time_since_start_min: 120     # t >= recording start + 120 min (= policy warm-up; executable spec)
  warmup_restart_after_gap_min: null  # FINAL: labels are not re-anchored (P-C7 is policy-only; ANALYSIS_PLAN §0 item 5)

population:                         # [CLASS C] Table 5.1 "Treated patient"
  primary: treated
  treated_def: [insulin_any, sulfonylurea, glinide]   # analysis population only, never a model input

partition:                          # [CLASS C] Section 8.6 / 10.3 — IMMUTABLE (ADR-016)
  file: configs/partition.csv       # imported from the blueprint audit; provenance: configs/partition.provenance.json
  sha256: ccdcbce02b049992b0ca09bd99a2a5b8c49bcf49940f3a68ed6ca69cd2449578
  version: "1.0.0"
  seed: 2026
  frac_T: 0.30
  strata: [treated, has_l1_episode]

gates:                              # [CLASS C] Blueprint Table 21.1 acceptance criteria
  g0:
    expected_recording_files: 109
    expected_patients: 100
    published_cgm_readings: 112475
  g1:
    min_cgm_parse_rate: 0.99        # >= 99% of readings parse
    min_interval_le_rate: 0.99      # >= 99% of intervals <= max_interval_min
    max_interval_min: 20
  g2:                               # event sufficiency (E-treated, L1)
    min_episodes: 100
    min_patients_with_episode: 20
    max_ci_half_width: 0.15         # 95% CI half-width of sensitivity at p_ref and icc_ref
    icc_ref: 0.15
    p_ref: 0.65
    icc_grid: [0.05, 0.15, 0.30]    # reported (Blueprint Table 8.4)
  g3:                               # medication usability (Blueprint Table 21.1)
    min_parse_rate: 0.90            # target administrations parsed to drug + dose
    min_day_coverage: 0.80          # median share of treated recording-days with >= 1 target administration
    max_timing_resolution_min: 15   # administration timestamps on the 15-min CGM grid
    min_treated_E_patients_with_variation: 20
  g3b:                              # label validity (CGM vs capillary)
    max_unconfirmed_share: 0.50     # > 50 % unconfirmed among episodes with a concurrent CBG -> TRIGGERED
    pair_window_min: 8              # CBG paired to the nearest CGM within +/- 8 min
    episode_cbg_tail_min: 15        # CBG "during" an episode: [onset, last in-episode reading + 15 min]

data_quality:                      # loader invariants (Class A)
  cgm_plausible_range_mgdl: [20, 600]

cv:                                 # [CLASS C] Section 15 / 20.1
  folds: 5
  seed: 2026
  inner_folds: 4

model:                              # [CLASS B] Section 11.1 (learner choice and search space)
  learner: lightgbm
  objective: binary
  class_weighting: none
  deterministic: true
  num_threads: 1
  seed: 2026
  tuned_on: M1
  optuna_trials: 30
  search_space:
    learning_rate: [0.02, 0.1]
    num_leaves: [7, 31]
    min_data_in_leaf: [100, 800]
    feature_fraction: [0.6, 1.0]
    bagging_fraction: [0.7, 1.0]
    lambda_l2: [0.0, 10.0]
  max_rounds: 2000

calibration:                        # [CLASS B] Section 11.1 (method); band rule fixed before E is opened
  method: isotonic_interp_floored   # FINAL (DEC-2026-10-19-M; ANALYSIS_PLAN §5.4 item 12). P-B10 verdict INCONCLUSIVE preserved
  band_rule: {slope_min: 0.8, slope_max: 1.25}

policy:                             # [CLASS C] budgets and cooldown (Table 5.1, Section 14)
  fa_budget_alert: 1.0              # false alerts per patient-day -> tau_A
  fa_budget_watch: 3.0              # -> tau_W (definition ambiguity: docs/PROPOSALS.md P-C6)
  cooldown_min: 60
  # data-sufficiency rules (Table 14.1 priority 2)
  max_gap_min: 20
  floor_mgdl: 40
  max_rate_mgdl_per_min: 4
  warmup_min: 120
  warmup_restart_after_gap_min: 120 # P-C7 APPROVED: policy warm-up re-anchors after a CGM gap > 120 min (labels unchanged)

exposure:                           # [CLASS B] Section 12; kernel parameters live in pharma.yaml
  pharma: configs/pharma.yaml
  dictionary: configs/drug_dictionary.csv   # not yet created (S3)
  timing_unknown_after_h: 36
  iv_flag_h: 4
  projections_min: [30, 60]

features:                           # [CLASS B] Appendix D representation constants (S4). Values are
                                    # the blueprint's where it states them; the rest are a-priori
                                    # operational choices, fixed before any model is fitted
                                    # (docs/FEATURE_DICTIONARY.md; DECISION_LOG ADR-030).
  spec_version: "1.0.1"               # 1.0.1 (S5): exact rational slope arithmetic (ADR-036)
  cgm_nominal_interval_min: 15      # ShanghaiT2DM sampling interval (S1: >= 99 % of intervals <= 20 min)
  lags_min: [15, 30, 45, 60]        # App. D group 1: g at t-15 ... t-60
  lag_tolerance_min: 7.5            # reading nearest to t-L within +/- half a sampling interval
  trend_window_tolerance_min: 5     # slope over "last D min" uses (t - D - 5, t]: the executable
                                    # spec's M0 window (audit2.py: ts > t - 35 min)
  slope_windows_min: [30, 60, 120]  # App. D group 2
  slope_min_readings: 3             # M0: ">= 3 readings" (Table 11.1; audit2.py)
  m0_projections_min: [30, 60]      # App. D group 1: M0 projection at t+30, t+60
  stat_windows_min: [120, 360, 1440]  # App. D group 3: min, mean, SD over 2 h, 6 h, 24 h
  below_threshold_mgdl: 80          # App. D group 3: minutes < 80 mg/dL in the past 24 h
  min_since_low_cap_min: 1440       # minutes since last reading < 70 (cap = the 24-h lookback)
  own_percentile_min_history_h: 24  # App. D group 3: percentile within own history (>= 24 h)
  night_hours: [0, 6]               # App. D group 4: night flag 00:00-05:59 (local clock)
  meal_min_since_cap_min: 720       # App. D group 6
  meal_recent_window_min: 180       # App. D group 6: meal logged in the last 3 h
  static_plausible:                 # validation ranges (values outside -> missing, counted)
    age_y: [18, 110]
    bmi: [10, 70]
    weight_kg: [25, 250]
    diabetes_duration_y: [0, 70]
    hba1c_mmol_mol: [15, 200]
    egfr: [1, 400]                  # wide: catches gross errors only (T max 257 kept; S3 keep-and-flag rule)
    c_peptide_fasting_nmol_l: [0, 10]

bootstrap:                          # [CLASS C] Section 20.1
  resamples: 2000
  seed: 2027
  unit: patient
  interval: percentile_95

sensitivity:
  fold_seeds_sa7: [2028, 2029, 2030, 2031, 2032]

time:
  assumed_utc_offset: "+08:00"      # ASSUMPTION (Section 8.8)

replay:
  speed: 120
  source: E_out_of_fold             # before freeze, replay is restricted to T patients
  cases: demo/cases.json
