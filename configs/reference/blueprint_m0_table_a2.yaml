# the S5 evaluation harness (legacy reproduction).
#
# Sources (transcribed, not computed):
# - Blueprint Table A.2: sensitivity and FA/day to 2 dp, median lead in min.
# - HypoSense_v2_sources/audit_outputs/audit2_summary.json (B0_tuning_treated / B0_tuning_all):
#   integer episode and warned counts, sensitivity to 3 dp, monitored days (the blueprint
#   table's source).
#
# DISCREPANCY (recorded, S5): the bundled audit2.py hard-codes thresholds (60, 70, 80, 90) and
# has no lead-30 block, whereas audit2_summary.json holds thresholds 40-80 and
# B0_tuning_treated_lead30. The JSON therefore came from a slightly different version of the
# script. Its evaluate() semantics are taken as the reference: forecasts and notifications at
# label-eligible times only, a greedy 60-min cooldown (>= 3600 s), FA = notification with no
# onset in (t, t+60], hit = an alert at an eligible t in [onset-60, onset-15], days =
# (last - first CGM)/86400 per recording.
