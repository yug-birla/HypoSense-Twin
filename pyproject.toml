[project]
name = "hyposense"
version = "0.0.1"
description = "HypoSense Twin v2 — exposure-aware patient-state twin for forecasting CGM-detected hypoglycaemia (research prototype; not a medical device)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    # data
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "xlrd>=2.0",            # ShanghaiT2DM ships legacy .xls files
    # contracts and configuration
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # modelling and evaluation
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "shap>=0.45",
    "scipy>=1.13",
    # API (S7)
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
# Cross-platform replacement for the blueprint's Makefile targets (no `make` on Windows).
# Subcommands are added stage by stage: audit, freeze, confirm, demo.
hyposense = "hyposense.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyposense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "requires_data: needs the official ShanghaiT2DM copy under data/raw (skipped otherwise)",
    "slow: long-running (full-dataset or full-training) test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Markdown report template: table rows are long string literals; wrapping hurts readability.
"src/hyposense/audit/run.py" = ["E501"]
"src/hyposense/audit/event_run.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unused_ignores = true
